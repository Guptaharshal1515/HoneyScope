<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Administration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 50%, #1a0e0e 100%);
            color: #e0e0e0;
        }

        .admin-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 20px;
            padding: 44px 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .admin-logo .shield {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.3);
        }

        .admin-logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .admin-logo p {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #dc2626;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .btn-admin {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            margin-top: 6px;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.4);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
        }

        .back-link:hover { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-logo">
                <div class="shield">🛡️</div>
                <h1>System Administration</h1>
                <p>Restricted Access — Authorized Admins Only</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/admin">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" name="password" placeholder="Password">
                </div>
                <button type="submit" class="btn-admin">Authenticate</button>
            </form>

            <a href="/login" class="back-link">← Back to main portal</a>
        </div>
    </div>
</body>
</html>
