title: HoneyScope SSRF - Internal Service Access Detected
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: >
  Detects Server-Side Request Forgery attempts against the HoneyScope ssrf scenario,
  including requests to cloud metadata endpoints, internal services, and alternate
  URL encodings used to bypass blocklists.
references:
  - https://portswigger.net/web-security/ssrf
  - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
author: HoneyScope
date: 2026-11-15
tags:
  - attack.discovery
  - attack.t1090
logsource:
  category: webserver
  product: honeyscope
detection:
  selection:
    cs-uri-stem|contains: '/api/fetch'
    cs-payload|re: '(?i)(169\.254\.169\.254|internal-metadata|internal-api|0x7f|file://|dict://|gopher://|ssrf|redirect-service)'
  condition: selection
falsepositives:
  - Security scanners performing SSRF testing
  - Developers testing internal URL resolution in a lab environment
level: high
