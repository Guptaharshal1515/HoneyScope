title: HoneyScope JWT Handling Flaws - Attack Detected
id: d4e8f1a2-3b7c-4d9e-8f0a-1b2c3d4e5f6a
status: experimental
description: >
  Detects JWT forgery attempts against the HoneyScope jwt-flaws scenario,
  including alg=none attacks and kid header injection.
references:
  - https://portswigger.net/web-security/jwt
  - https://owasp.org/www-project-web-security-testing-guide/
author: HoneyScope
date: 2026-11-15
tags:
  - attack.credential_access
  - attack.t1550.001
logsource:
  category: webserver
  product: honeyscope
detection:
  selection:
    cs-uri-stem|contains: '/api/auth/'
    cs-method: 'POST'
    # Shared detection_regex from scenario.json
    cs-payload|re: '(?i)alg.*none|"alg"\s*:\s*"none"|kid.*injection|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.$'
  condition: selection
falsepositives:
  - Legitimate API clients that log full request bodies containing JWT tokens
  - Security scanners running against the lab environment
level: high
