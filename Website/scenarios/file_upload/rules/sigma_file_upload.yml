title: HoneyScope Insecure File Upload Attempt
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: Detects executable or scripting file upload attempts, spoofed Content-Type, or webshell patterns.
author: HoneyScope
date: 2026-11-15
tags: [attack.t1105]
logsource:
  category: webserver
  product: honeyscope
detection:
  selection:
    cs-uri-stem|re: '(?i)(\.php|\.py|\.sh|\.exe|\.jsp|webshell|Content-Type.*image.*php|shell\.php)'
  condition: selection
falsepositives: [Legitimate file uploads with unusual names]
level: high
